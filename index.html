<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ff8fb1">
<title>💌 有一封信给你</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }
  body {
    background: linear-gradient(160deg, #ffe3ec 0%, #ffd6e7 30%, #f6d5ff 65%, #e7d6ff 100%);
    background-size: 200% 200%;
    animation: bgShift 16s ease-in-out infinite alternate;
  }
  @keyframes bgShift {
    from { background-position: 0% 0%; }
    to   { background-position: 100% 100%; }
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #bgCanvas { z-index: 1; }
  #fxCanvas { z-index: 40; pointer-events: none; }

  .screen {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    text-align: center;
    transition: opacity .55s ease, visibility .55s;
  }
  .screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  .emoji-big {
    font-size: clamp(64px, 18vw, 110px);
    line-height: 1.15;
    animation: floaty 2.6s ease-in-out infinite;
    filter: drop-shadow(0 10px 18px rgba(255, 105, 150, .35));
  }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

  h1.title {
    margin-top: 22px;
    font-size: clamp(26px, 7.2vw, 40px);
    color: #d6336c;
    letter-spacing: 1px;
    text-shadow: 0 2px 0 #fff, 0 6px 18px rgba(214, 51, 108, .18);
  }
  .typeline {
    margin-top: 14px;
    min-height: 1.9em;
    font-size: clamp(16px, 4.4vw, 20px);
    color: #8a4b60;
    line-height: 1.9;
    white-space: pre-wrap;
  }
  .typeline .cursor { display: inline-block; width: 2px; height: 1em; background: #d6336c; vertical-align: -0.15em; animation: blink .8s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .btn {
    border: none; cursor: pointer;
    font-family: inherit;
    border-radius: 999px;
    transition: transform .25s ease, box-shadow .25s ease, opacity .3s;
    touch-action: manipulation;
  }
  .btn:active { transform: scale(.94); }

  .btn-main {
    margin-top: 34px;
    padding: 16px 46px;
    font-size: clamp(18px, 5vw, 22px);
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #ff7eb3, #ff65a3 55%, #f76a8c);
    box-shadow: 0 10px 24px rgba(247, 106, 140, .45), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .btn-main:active { box-shadow: 0 6px 14px rgba(247, 106, 140, .4); }

  .btn-row {
    margin-top: 40px;
    display: flex; align-items: center; justify-content: center; gap: 22px;
    min-height: 76px;
    width: 100%;
  }
  #btnYes {
    padding: 15px 42px;
    font-size: clamp(18px, 5vw, 22px);
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #ff8fb1, #f76a8c);
    box-shadow: 0 10px 24px rgba(247, 106, 140, .45), inset 0 1px 0 rgba(255,255,255,.5);
    transform: scale(var(--s, 1));
  }
  #btnNo {
    padding: 15px 34px;
    font-size: clamp(16px, 4.4vw, 19px);
    color: #a85d75;
    background: rgba(255, 255, 255, .85);
    box-shadow: 0 8px 18px rgba(168, 93, 117, .25);
  }
  #btnNo.dodging {
    position: fixed;
    margin: 0;
    z-index: 45;
    transition: left .28s cubic-bezier(.34,1.56,.64,1), top .28s cubic-bezier(.34,1.56,.64,1), transform .25s;
  }

  .days-badge {
    display: inline-block;
    margin-bottom: 18px;
    padding: 8px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .7);
    color: #c2255c;
    font-size: clamp(13px, 3.6vw, 15px);
    letter-spacing: 1px;
    box-shadow: 0 4px 12px rgba(214, 51, 108, .15);
  }
  .question {
    font-size: clamp(28px, 8vw, 44px);
    font-weight: 700;
    color: #d6336c;
    line-height: 1.5;
    text-shadow: 0 2px 0 #fff, 0 8px 20px rgba(214, 51, 108, .2);
  }
  .dodge-line {
    margin-top: 26px;
    min-height: 1.7em;
    font-size: clamp(15px, 4.2vw, 18px);
    color: #a85d75;
    opacity: .95;
  }

  /* 庆祝页 */
  .heart-pulse {
    font-size: clamp(84px, 24vw, 140px);
    line-height: 1.2;
    animation: pulse 1.1s ease-in-out infinite;
    filter: drop-shadow(0 12px 26px rgba(255, 60, 110, .45));
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 35% { transform: scale(1.16); } 60% { transform: scale(.96); } }
  .cheer {
    margin-top: 20px;
    font-size: clamp(24px, 7vw, 36px);
    font-weight: 800;
    color: #e64980;
    text-shadow: 0 2px 0 #fff, 0 8px 22px rgba(230, 73, 128, .3);
  }
  .bless {
    margin-top: 14px;
    font-size: clamp(16px, 4.6vw, 20px);
    color: #8a4b60;
    line-height: 1.9;
    white-space: pre-wrap;
  }
  .date-line {
    margin-top: 18px;
    font-size: clamp(13px, 3.6vw, 15px);
    color: #b06a85;
    letter-spacing: 2px;
  }
  .btn-again {
    margin-top: 30px;
    padding: 12px 34px;
    font-size: 16px;
    color: #a85d75;
    background: rgba(255, 255, 255, .8);
    box-shadow: 0 8px 18px rgba(168, 93, 117, .22);
  }

  /* 音乐按钮 */
  #btnMusic {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    right: 16px;
    z-index: 60;
    width: 46px; height: 46px;
    border-radius: 50%;
    font-size: 21px;
    background: rgba(255, 255, 255, .75);
    box-shadow: 0 4px 14px rgba(214, 51, 108, .2);
    display: flex; align-items: center; justify-content: center;
  }
  #btnMusic.playing { animation: spin 5s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .fade-in { opacity: 0; transform: translateY(14px); animation: fadeUp .7s ease forwards; }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

  /* 微信文件预览里的自救提示 */
  .wx-tip {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom));
    z-index: 70;
    max-width: 86%;
    padding: 12px 18px;
    border-radius: 14px;
    background: rgba(255, 255, 255, .95);
    color: #c2255c;
    font-size: 14px;
    line-height: 1.7;
    box-shadow: 0 8px 22px rgba(194, 37, 92, .28);
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .emoji-big, .heart-pulse, #btnMusic.playing, body { animation: none !important; }
  }
</style>
</head>
<body>
<canvas id="bgCanvas" aria-hidden="true"></canvas>

<!-- 音乐开关 -->
<button id="btnMusic" class="btn" aria-label="音乐开关">🔇</button>

<!-- 第 1 屏：开场 -->
<section id="screenIntro" class="screen">
  <div class="emoji-big">💌</div>
  <h1 class="title" id="introTitle">嘿，有人给你写了封信</h1>
  <div class="typeline" id="introType"><span class="cursor"></span></div>
  <button id="btnOpen" class="btn btn-main" style="visibility:hidden">打开它 💌</button>
</section>

<!-- 第 2 屏：表白 -->
<section id="screenQuestion" class="screen hidden">
  <div class="days-badge" id="daysBadge">💗</div>
  <div class="emoji-big">🥺</div>
  <h1 class="question" id="questionText" style="margin-top:18px"></h1>
  <div class="dodge-line" id="dodgeLine"></div>
  <div class="btn-row">
    <button id="btnYes" class="btn">好呀！💕</button>
    <button id="btnNo" class="btn">不要</button>
  </div>
</section>

<!-- 第 3 屏：成功 -->
<section id="screenCelebrate" class="screen hidden">
  <div class="heart-pulse">❤️</div>
  <div class="cheer" id="cheerText">太好了！！！🎉</div>
  <div class="bless" id="blessText"></div>
  <div class="date-line" id="dateLine"></div>
  <button id="btnAgain" class="btn btn-again">再看一遍 🔁</button>
</section>

<canvas id="fxCanvas" aria-hidden="true"></canvas>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════
   ♥ 在这里自定义你的表白内容（改完保存，发给 TA 就行） ♥
   ══════════════════════════════════════════════════════════ */
const CONFIG = {
  toName:    "亲爱的婷婷",              // TA 的名字 / 昵称
  fromName:  "一个偷偷喜欢你的人",         // 你的名字 / 昵称
  question:  "做我的女朋友，好不好？",   // 表白的问题
  startDate: "2026-09-23",            // 你们认识（或在一起）的日期，格式 YYYY-MM-DD
  finalLine: "这是我今年听过最动听的一句话\n从今天起，我要和你好好在一起",
  // 点「不要」按钮时 TA 说的话，可自行增减；点完最后一条后「不要」会投降
  dodgeTexts: [
    "咦？点不到吧 😝",
    "再点它就要跑咯～",
    "别追啦，左边那个才是真爱",
    "『不要』按钮已离家出走 🏃",
    "它说它累了，你点不到的 😌",
    "劝你早点点『好呀』，有惊喜哦",
    "手速可以啊，但没用的 🤏",
    "好了好了，它投降了……"
  ]
};
/* ═══════════════════════ 自定义结束 ═══════════════════════ */

const $ = id => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- 屏幕切换 ---------- */
function show(screen) {
  for (const s of ["screenIntro", "screenQuestion", "screenCelebrate"])
    $(s).classList.toggle("hidden", s !== screen);
}

/* ---------- 第 1 屏：打字机 ---------- */
const introLines = [
  CONFIG.toName + "：",
  "我有一句藏了很久的话，",
  "今天终于鼓起勇气，想说给你听……"
];
let typingTimer = null;
function typeIntro() {
  const box = $("introType");
  let li = 0, ci = 0, out = "";
  function step() {
    if (li >= introLines.length) { onTyped(); return; }
    const line = introLines[li];
    if (ci < line.length) {
      out += line[ci++];
      box.innerHTML = out.replace(/\n/g, "<br>") + '<span class="cursor"></span>';
      typingTimer = setTimeout(step, 130);
    } else {
      out += "\n"; li++; ci = 0;
      typingTimer = setTimeout(step, 320);
    }
  }
  step();
}
function skipIntro() {
  if ($("btnOpen").style.visibility === "visible") return;
  clearTimeout(typingTimer);
  $("introType").innerHTML = introLines.join("<br>") + '<span class="cursor"></span>';
  onTyped();
}
function onTyped() { $("btnOpen").style.visibility = "visible"; }
$("screenIntro").addEventListener("pointerdown", skipIntro);
typeIntro();

/* ---------- 第 2 屏：表白 ---------- */
const days = 999999;
$("daysBadge").textContent = "💗 我已经喜欢你 " + days + " 天了";
$("questionText").textContent = CONFIG.question;

let dodgeCount = 0;
const noBtn = $("btnNo"), yesBtn = $("btnYes");
const dodgeLines = CONFIG.dodgeTexts;

function dodge() {
  dodgeCount++;
  // 打字提示
  const line = dodgeLines[Math.min(dodgeCount, dodgeLines.length) - 1] || dodgeLines[dodgeLines.length - 1];
  $("dodgeLine").textContent = line;
  // 「好呀」变大，「不要」变小
  yesBtn.style.setProperty("--s", Math.min(1.55, 1 + dodgeCount * 0.09).toFixed(2));
  noBtn.style.transform = "scale(" + Math.max(0.55, 1 - dodgeCount * 0.05).toFixed(2) + ")";
  // 第一次躲：转为 fixed，之后随机跳
  if (dodgeCount === 1) {
    const r = noBtn.getBoundingClientRect();
    noBtn.classList.add("dodging");
    noBtn.style.left = r.left + "px";
    noBtn.style.top = r.top + "px";
    noBtn.style.width = r.width + "px";
  }
  if (dodgeCount > dodgeLines.length) { surrender(); return; }
  hop();
}
function hop() {
  const bw = noBtn.offsetWidth || 120, bh = noBtn.offsetHeight || 50;
  const vw = innerWidth, vh = innerHeight;
  const topMin = 70 + (window.visualViewport ? 0 : 0), topMax = vh - bh - 130;
  let nx, ny, tries = 0;
  do {
    nx = 14 + Math.random() * Math.max(1, vw - bw - 28);
    ny = topMin + Math.random() * Math.max(1, topMax - topMin);
    tries++;
  } while (tries < 12 && Math.abs(ny - (vh - 170)) < 90); // 尽量别贴着「好呀」
  noBtn.style.left = nx + "px";
  noBtn.style.top = ny + "px";
}
function surrender() {
  noBtn.textContent = "哼，那就…我同意啦 💗";
  noBtn.style.transform = "scale(1)";
  $("dodgeLine").textContent = "『不要』已经倒戈，快去按下它吧！";
}
noBtn.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") dodge(); });
noBtn.addEventListener("touchstart", e => { e.preventDefault(); dodge(); }, { passive: false });
noBtn.addEventListener("click", e => { e.preventDefault(); if (noBtn.textContent.includes("同意")) celebrate(); else dodge(); });

yesBtn.addEventListener("click", () => {
  const r = yesBtn.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
  celebrate();
});

/* ---------- 第 3 屏：庆祝 ---------- */
function celebrate() {
  show("screenCelebrate");
  $("cheerText").textContent = "「好呀」！🎉";
  $("blessText").textContent = CONFIG.finalLine;
  const d = new Date();
  $("dateLine").textContent =
    "—— " + d.getFullYear() + " 年 " + (d.getMonth() + 1) + " 月 " + d.getDate() + " 日，请记住这一天";
  fireworkShow();
}
$("btnAgain").addEventListener("click", () => {
  dodgeCount = 0;
  noBtn.textContent = "不要";
  noBtn.style.transform = "";
  noBtn.classList.remove("dodging");
  noBtn.style.left = noBtn.style.top = noBtn.style.width = "";
  yesBtn.style.setProperty("--s", 1);
  $("dodgeLine").textContent = "";
  show("screenQuestion");
});
/* 打开信的手势里启动音乐——iOS 只允许在点击动作中解锁声音，这是唯一的自动播放时机 */
$("btnOpen").addEventListener("click", () => {
  startMusic();
  show("screenQuestion");
});

/* ---------- 背景：漂浮的爱心 ---------- */
const bg = $("bgCanvas"), bgx = bg.getContext("2d");
const fx = $("fxCanvas"), fxx = fx.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  for (const c of [bg, fx]) {
    c.width = W * DPR; c.height = H * DPR;
    c.getContext("2d").setTransform(DPR, 0, 0, DPR, 0, 0);
  }
}
addEventListener("resize", resize);
resize();

function heartPath(c, s) {
  c.beginPath();
  c.moveTo(0, 0.35 * s);
  c.bezierCurveTo(-0.6 * s, -0.1 * s, -0.4 * s, -0.55 * s, 0, -0.22 * s);
  c.bezierCurveTo(0.4 * s, -0.55 * s, 0.6 * s, -0.1 * s, 0, 0.35 * s);
  c.closePath();
}
const PINKS = ["#ff7eb3", "#ff65a3", "#f783ac", "#faa2c1", "#e64980", "#ffb3c6"];

const floaters = Array.from({ length: reduceMotion ? 6 : 18 }, () => ({
  x: Math.random(), y: Math.random(),
  s: 8 + Math.random() * 16,
  v: 0.12 + Math.random() * 0.3,
  sway: Math.random() * Math.PI * 2,
  a: 0.12 + Math.random() * 0.25,
  c: PINKS[Math.random() * PINKS.length | 0]
}));

function drawBG(t) {
  bgx.clearRect(0, 0, W, H);
  for (const f of floaters) {
    f.y -= f.v / 60;
    if (f.y < -0.08) { f.y = 1.08; f.x = Math.random(); }
    const x = f.x * W + Math.sin(t / 1400 + f.sway) * 18;
    bgx.globalAlpha = f.a;
    bgx.fillStyle = f.c;
    bgx.save(); bgx.translate(x, f.y * H); bgx.rotate(Math.sin(t / 1600 + f.sway) * 0.25);
    heartPath(bgx, f.s); bgx.fill(); bgx.restore();
  }
  bgx.globalAlpha = 1;
}

/* ---------- 特效：爱心迸发 + 烟花 ---------- */
let parts = [], fireworkUntil = 0;
function burst(x, y) {
  for (let i = 0; i < (reduceMotion ? 10 : 34); i++) {
    const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
    parts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 2,
      s: 6 + Math.random() * 12, life: 1, decay: 0.012 + Math.random() * 0.012,
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * .2,
      c: PINKS[Math.random() * PINKS.length | 0], heart: true });
  }
}
function fireworkShow() {
  if (reduceMotion) return;
  fireworkUntil = performance.now() + 6000;
}
function spawnFirework() {
  const x = W * (0.15 + Math.random() * 0.7), y = H * (0.15 + Math.random() * 0.4);
  const hue = Math.random() < .5 ? 330 + Math.random() * 20 : 40 + Math.random() * 15;
  for (let i = 0; i < 46; i++) {
    const ang = (i / 46) * Math.PI * 2, sp = 1.5 + Math.random() * 3.5;
    parts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      s: 2 + Math.random() * 2.5, life: 1, decay: 0.014 + Math.random() * 0.01,
      c: "hsl(" + (hue + Math.random() * 14 - 7) + ", 90%, " + (60 + Math.random() * 20) + "%)",
      heart: false, rot: 0, vr: 0 });
  }
}
function drawFX() {
  fxx.clearRect(0, 0, W, H);
  if (performance.now() < fireworkUntil && Math.random() < 0.06) spawnFirework();
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.06; p.vx *= 0.99;
    p.life -= p.decay; p.rot += p.vr;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    fxx.globalAlpha = Math.max(0, p.life);
    fxx.fillStyle = p.c;
    fxx.save(); fxx.translate(p.x, p.y); fxx.rotate(p.rot);
    if (p.heart) { heartPath(fxx, p.s); fxx.fill(); }
    else { fxx.beginPath(); fxx.arc(0, 0, p.s, 0, 6.29); fxx.fill(); }
    fxx.restore();
  }
  fxx.globalAlpha = 1;
}
(function loop(t) {
  drawBG(t || 0);
  drawFX();
  requestAnimationFrame(loop);
})();

/* ---------- 微信内打开本地文件的提示 ---------- */
(function () {
  try {
    var inWeChat = /MicroMessenger/i.test(navigator.userAgent);
    var isLocal = location.protocol === "file:";
    if (!(inWeChat && isLocal)) return;
    var tip = document.createElement("div");
    tip.className = "wx-tip";
    tip.innerHTML = "💗 微信预览模式可能无法正常播放<br>请点右上角「···」→「在 Safari 中打开」<br>或「用其他应用打开」→「存储到文件」后用 Safari 打开";
    tip.addEventListener("click", function () { tip.remove(); });
    document.body.appendChild(tip);
    setTimeout(function () { tip && tip.remove(); }, 12000);
  } catch (e) { /* 提示失败不影响主流程 */ }
})();

/* ---------- 音乐：原创喜庆小舞曲（音乐盒音色 + 铃鼓节奏，原创旋律无版权） ---------- */
/* iOS 规定：音频必须在用户手指点击的动作里解锁。本页策略：
   进入页面先尝试自动播放；被系统拦截的话，在她第一次触摸屏幕的瞬间立即起乐
   （这是 iOS 允许的最早时机，体感接近自动播放）。 */
let audio = null, musicOn = false, musicTimer = null, musicWanted = false, songVersion = 0;
/* 首选真实音频文件 music.wav——iOS Safari/微信对 <audio> 的支持远好于 WebAudio 合成 */
const musicEl = new Audio("music.wav");
musicEl.loop = true;
musicEl.preload = "auto";
musicEl.setAttribute("playsinline", "");
musicEl.setAttribute("webkit-playsinline", "");
let fileOK = null; // null=未知，true=文件可播，false=文件不可用（回退合成）
musicEl.addEventListener("error", () => { fileOK = false; if (musicWanted) scheduleLoop(); }, { once: true });
const BPM = 138, BEAT = 60 / BPM;
const m2f = m => 440 * Math.pow(2, (m - 69) / 12);
function ensureAudio() {
  if (audio) return;
  audio = new (window.AudioContext || window.webkitAudioContext)();
}
/* iOS / 微信内核的解锁：恢复上下文 + 播放一个无声样本"占位" */
function unlockAudio() {
  ensureAudio();
  try {
    if (audio.state === "suspended") audio.resume();
    const buf = audio.createBuffer(1, 1, 22050);
    const src = audio.createBufferSource();
    src.buffer = buf;
    src.connect(audio.destination);
    src.start(0);
  } catch (e) { /* 解锁失败不影响主流程 */ }
}
function pluck(freq, when, dur, gain) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(gain, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g).connect(audio.destination);
  o.start(when); o.stop(when + dur + 0.05);
}
/* 铃鼓"嗒"：短促带通噪声，营造喜庆的跳跃感 */
let noiseBuf = null;
function tick(when, gain) {
  try {
    if (!noiseBuf) {
      noiseBuf = audio.createBuffer(1, 2205, 22050);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    }
    const src = audio.createBufferSource(); src.buffer = noiseBuf;
    const bp = audio.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 5200; bp.Q.value = 1.2;
    const g = audio.createGain();
    g.gain.setValueAtTime(gain, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.07);
    src.connect(bp).connect(g).connect(audio.destination);
    src.start(when); src.stop(when + 0.09);
  } catch (e) { }
}
/* 原创旋律：C 大调欢快小舞曲，16 小节循环。数据格式 [MIDI音高, 拍数]，每小节 2 拍 */
const MELODY = [
  [76,.5],[79,.5],[84,.5],[79,.5], [76,.5],[79,.5],[84,1],
  [74,.5],[79,.5],[83,.5],[79,.5], [74,.5],[79,.5],[83,1],
  [76,.5],[79,.5],[84,.5],[79,.5], [76,.5],[79,.5],[84,1],
  [77,.5],[81,.5],[84,.5],[81,.5], [79,.75],[76,.25],[72,1],
  [81,.5],[84,.5],[89,.5],[84,.5], [81,.5],[84,.5],[89,1],
  [79,.5],[83,.5],[88,.5],[83,.5], [79,.5],[83,.5],[88,1],
  [89,.5],[86,.5],[83,.5],[79,.5], [81,.5],[83,.5],[84,1],
  [86,.5],[83,.5],[79,.5],[76,.5], [72,1],[67,.5],[72,.5]
];
/* 每小节低音根音（boom-chick 伴奏） */
const BASS = [48,48,43,43, 48,48,41,48, 41,41,43,43, 43,48,43,48];
/* 只有在 audio 真正 running 后才排程，否则稍后重试——
   修复 iOS 上解锁瞬间时间轴未走、音符被排到过去导致"无声"的问题；
   songVersion 防止重入时叠加出双份音乐 */
function scheduleLoop() {
  clearTimeout(musicTimer);
  if (!musicWanted || !audio) return;
  if (audio.state !== "running") { musicTimer = setTimeout(scheduleLoop, 250); return; }
  const v = ++songVersion;
  const t0 = audio.currentTime + 0.08;
  let t = t0;
  for (const note of MELODY) {
    const dur = note[1] * BEAT;
    pluck(m2f(note[0]), t, Math.max(0.35, dur * 1.6), 0.10);        // 主音：音乐盒
    pluck(m2f(note[0] + 12), t, Math.max(0.3, dur * 1.1), 0.028);   // 高八度：闪光
    t += dur;
  }
  const total = t - t0;
  for (let bar = 0; bar < BASS.length; bar++) {
    const bt = t0 + bar * 2 * BEAT;
    pluck(m2f(BASS[bar]), bt, 0.5, 0.09);                 // 咚（根音）
    pluck(m2f(BASS[bar] + 7), bt + BEAT, 0.35, 0.06);     // 咚（五音）
    tick(bt, 0.05);                                        // 嗒（重拍）
    tick(bt + BEAT, 0.028);                                // 嗒（弱拍）
  }
  musicTimer = setTimeout(() => { if (v === songVersion) scheduleLoop(); }, total * 1000);
}
function setMusicUI(on) {
  $("btnMusic").textContent = on ? "🎵" : "🔇";
  $("btnMusic").classList.toggle("playing", on);
}
function startMusic() {
  if (musicWanted) return;
  musicWanted = true; musicOn = true;
  unlockAudio();
  setMusicUI(true);
  let p = null;
  try { p = musicEl.play(); } catch (e) { }
  if (p && p.then) p.then(() => { fileOK = true; }).catch(() => { fileOK = false; scheduleLoop(); });
  else scheduleLoop();
}
function stopMusic() {
  musicWanted = false; musicOn = false; songVersion++;
  try { musicEl.pause(); } catch (e) { }
  clearTimeout(musicTimer);
  setMusicUI(false);
}
/* 进入页面先尝试自动播放；若被 iOS 拦截，第一次触摸屏幕的瞬间立即起乐 */
(function autoPlay() {
  function attempt() {
    if (musicOn) return;
    unlockAudio();
    try {
      if (audio.state === "running") { startMusic(); return; }
    } catch (e) { }
    var armed = false;
    function once() {
      if (armed) return; armed = true;
      document.removeEventListener("pointerdown", once, true);
      document.removeEventListener("touchstart", once, true);
      if (!musicOn) startMusic();
    }
    document.addEventListener("pointerdown", once, { capture: true });
    document.addEventListener("touchstart", once, { capture: true });
  }
  if (document.readyState === "complete") setTimeout(attempt, 200);
  else addEventListener("load", () => setTimeout(attempt, 200));
})();
$("btnMusic").addEventListener("click", () => {
  if (musicOn) { stopMusic(); }
  else { musicWanted = false; startMusic(); burst(innerWidth - 40, 40); }
});
/* 微信 iOS 内核：JSBridge 就绪后再补一次 */
document.addEventListener("WeixinJSBridgeReady", () => {
  if (musicWanted) {
    unlockAudio();
    try { musicEl.play(); } catch (e) { }
    if (fileOK === false) scheduleLoop();
  }
}, false);
/* 页面从后台回前台时，Safari 会挂起音频，这里自动续上 */
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && musicWanted) {
    unlockAudio();
    try { musicEl.play(); } catch (e) { }
    if (fileOK === false) scheduleLoop();
  }
});
</script>
